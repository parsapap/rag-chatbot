services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: rag
      POSTGRES_DB: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Postgres 18 images keep data under /var/lib/postgresql/18/docker,
    # so the volume is mounted one level up (not at .../data as in older images).
    volumes:
      - pgdata:/var/lib/postgresql
    # No "ports:" on purpose: the DB is reachable only from other containers.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 2s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: rag
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    # Queued messages live here, so they survive a restart of RabbitMQ.
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    # Management panel only, and only on this machine. The broker port 5672 stays inside compose.
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  worker:
    build: ./backend
    # concurrency 1: documents are embedded one at a time, so they queue up for the Gemini quota
    # instead of all hitting it together.
    command: ["celery", "-A", "app.worker", "worker", "--concurrency=1", "--loglevel=info"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rag:${POSTGRES_PASSWORD}@db:5432/rag
      CELERY_BROKER_URL: amqp://rag:${RABBITMQ_PASSWORD}@rabbitmq:5672//
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # shortcut: no --reload like the API; restart the worker after changing task code.
    volumes:
      - ./backend/app:/app/app:ro

  app:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rag:${POSTGRES_PASSWORD}@db:5432/rag
      CELERY_BROKER_URL: amqp://rag:${RABBITMQ_PASSWORD}@rabbitmq:5672//
    depends_on:
      db:
        condition: service_healthy
    # Bind mounts: code and data edits on the host show up without rebuilding.
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/tests:/app/tests:ro
      - ./data:/app/data:ro
      # Writable: app.cli.make_eval saves the generated eval set here.
      - ./data/eval:/app/data/eval

  api:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rag:${POSTGRES_PASSWORD}@db:5432/rag
      CELERY_BROKER_URL: amqp://rag:${RABBITMQ_PASSWORD}@rabbitmq:5672//
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # 127.0.0.1 only: there is no login rate limit per IP, no HTTPS and no Secure cookie yet,
    # so the API must not be reachable from other machines.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app:ro

  frontend:
    build: ./frontend
    environment:
      # Server-side calls go over the compose network, so no CORS is needed.
      API_URL: http://api:8000
    depends_on:
      - api
    # 127.0.0.1 only, same as the API: there is no real auth yet.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend/app:/app/app:ro

volumes:
  pgdata:
  rabbitmqdata:
